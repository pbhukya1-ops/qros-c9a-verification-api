[project]
name = "qros-c9a-verification-api"
version = "0.1.0"
description = "Read-only verification API for the immutable QROS C8A parent baseline"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]>=0.141,<1.0",
    "uvicorn>=0.35,<1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "verification.py",
    "evidence_root/**"
]
